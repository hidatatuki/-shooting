<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カナブン・パニック - リアル昆虫版</title>
    <style>
        body {
            background-color: #0b140b;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
        }
        h1 {
            margin: 3px 0;
            font-size: 20px;
            color: #76ff03;
            text-shadow: 0 0 10px #76ff03;
        }
        canvas {
            border: 4px solid #76ff03;
            background-color: #000;
            box-shadow: 0 0 25px rgba(118, 255, 3, 0.4);
        }
        .instructions {
            margin-top: 5px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            line-height: 1.4;
        }
        .name-container {
            margin-top: 5px;
            font-size: 13px;
            color: #76ff03;
            text-align: center;
        }
        .name-container input {
            background-color: #0b140b;
            border: 1px solid #76ff03;
            color: #fff;
            padding: 3px 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>KABUTO PANIC - REAL BUG EDITION</h1>
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    <div class="instructions">
        [マウス移動] 自機誘導 ｜ [左クリック] 攻撃 ｜ [Enter] スタート画面へ戻る<br>
        アイテム落とす虫: カナブン(🟦追尾弾) ｜ クワガタ(🟨電気) ｜ カメムシ(🟩回復) ｜ カブトムシ(🟪アーマー) ｜ 子蜘蛛(🟥ランチャー)
    </div>
    <div class="name-container">
        PLAYER NAME: <input type="text" id="playerNameInput" value="PLAYER" maxlength="10">
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            let now = audioCtx.currentTime;

            if (type === 'green') { 
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            } else if (type === 'blue') { 
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            } else if (type === 'purple') { 
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
            } else if (type === 'squash') { 
                let bufferSize = audioCtx.sampleRate * 0.15;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);
                filter.frequency.linearRampToValueAtTime(100, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 0.15);
                return;
            } else if (type === 'electric') { 
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
            } else if (type === 'barrierBreak') { 
                let bufferSize = audioCtx.sampleRate * 0.15;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.setValueAtTime(1000, now);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now); noise.stop(now + 0.15);
                return;
            }

            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + (type === 'purple' ? 0.3 : 0.15));
        }

        const mouse = { x: canvas.width / 2, y: canvas.height / 2 + 100, isDown: false };
        window.addEventListener('mousemove', (e) => { const rect = canvas.getBoundingClientRect(); mouse.x = e.clientX - rect.left; mouse.y = e.clientY - rect.top; });
        window.addEventListener('mousedown', (e) => { if (e.button === 0) mouse.isDown = true; });
        window.addEventListener('mouseup', (e) => { if (e.button === 0) mouse.isDown = false; });
        window.addEventListener('keydown', (e) => {
            if (gameOver && e.code === 'Enter') {
                gameOver = false;
                gameStarted = false;
            }
            if (!gameStarted) {
                let nameInput = document.getElementById('playerNameInput');
                if (document.activeElement === nameInput && e.key === 'Enter') {
                    e.preventDefault();
                    playerName = nameInput ? nameInput.value.trim() || 'PLAYER' : 'PLAYER';
                    nameInput.blur();
                    return;
                }

                if (e.key === '1') { 
                    if (nameInput) {
                        playerName = nameInput.value.trim() || 'PLAYER';
                    }
                    selectedInitialWeapon = 'smoke'; gameStarted = true; initGame(); 
                }
                else if (e.key === '2') { 
                    if (nameInput) {
                        playerName = nameInput.value.trim() || 'PLAYER';
                    }
                    selectedInitialWeapon = 'normalLaser'; gameStarted = true; initGame(); 
                }
            }
        });

        let gameStarted = false, gameOver = false, selectedInitialWeapon = 'smoke';
        let score = 0, lives = 3, armor = 0, manualLevel = 1;
        let gameTime = 0, spawnTimer = 0, shootCooldown = 0, heavyCooldown = 0;
        let electricActiveTimer = 0, laserActiveTimer = 0, screenShake = 0;
        let bossSpawnedInLevel4 = false;
        let playerName = 'PLAYER';
        
        // localStorageからハイスコアを読み込む（なければ初期値）
        let highScores = JSON.parse(localStorage.getItem('kabutoPanicHighScores')) || [
            { name: '---', score: 0 },
            { name: '---', score: 0 },
            { name: '---', score: 0 }
        ];

        const player = { x: canvas.width / 2, y: canvas.height / 2 + 100, width: 30, height: 30, weaponType: 'smoke', lastAngle: -Math.PI / 2 };

        let kabutos = [], items = [], pesticides = [], lasers = [], homingLasers = [], redHeavyLasers = [], bossBullets = [], webEffects = [], particles = [];

        const nameInput = document.getElementById('playerNameInput');

        class Particle {
            constructor(x, y, color, speed, life) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.life = life; this.maxLife = life; this.radius = Math.random() * 4 + 2;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.life--; this.radius *= 0.95;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        function attack() {
            if (gameOver || shootCooldown > 0) return;
            
            let inWeb = webEffects.some(w => Math.hypot(player.x - w.x, player.y - w.y) < w.radius);
            if (inWeb) return;
            
            let currentWeapon = player.weaponType;
            if (laserActiveTimer > 0) currentWeapon = 'laser';

            if (currentWeapon === 'smoke') {
                if (heavyCooldown > 0) return;
                pesticides.push({ x: player.x, y: player.y, radius: 45, lifeTime: 180, maxLife: 180 });
                playSound('purple');
                heavyCooldown = 300;
                shootCooldown = 20;
                screenShake = 5;
            } else if (currentWeapon === 'normalLaser') {
                let targetAngle = player.lastAngle;
                if (kabutos.length > 0) {
                    let nearest = kabutos[0], minDist = Math.hypot(nearest.x - player.x, nearest.y - player.y);
                    for (let i = 1; i < kabutos.length; i++) {
                        let d = Math.hypot(kabutos[i].x - player.x, kabutos[i].y - player.y);
                        if (d < minDist) { minDist = d; nearest = kabutos[i]; }
                    }
                    targetAngle = Math.atan2((nearest.y - player.y), (nearest.x - player.x));
                }
                lasers.push({ x: player.x, y: player.y, vx: Math.cos(targetAngle) * 15, vy: Math.sin(targetAngle) * 15 });
                playSound('green');
                shootCooldown = 75;
            } else if (currentWeapon === 'laser') { 
                homingLasers.push({ x: player.x, y: player.y, vx: Math.cos(player.lastAngle) * 6, vy: Math.sin(player.lastAngle) * 6, speed: 9 });
                playSound('blue');
                shootCooldown = 12;
            } else if (currentWeapon === 'redHeavyLaser') { 
                redHeavyLasers.push({ x: player.x, y: player.y, vx: Math.cos(player.lastAngle) * 8, vy: Math.sin(player.lastAngle) * 8, speed: 10, radius: 25 });
                playSound('barrierBreak');
                screenShake = 10;
                shootCooldown = 30;
                player.weaponType = selectedInitialWeapon; 
            }
        }

        class Kabuto {
            constructor(type, isBoss = false) {
                this.type = type; this.isBoss = isBoss;
                let side = Math.floor(Math.random() * 4);
                if (isBoss) { 
                    this.x = canvas.width / 2; this.y = -100; 
                } else {
                    if (side === 0) { this.x = Math.random() * canvas.width; this.y = -30; }
                    else if (side === 1) { this.x = Math.random() * canvas.width; this.y = canvas.height + 30; }
                    else if (side === 2) { this.x = -30; this.y = Math.random() * canvas.height; }
                    else { this.x = canvas.width + 30; this.y = Math.random() * canvas.height; }
                }
                
                this.zigZagTimer = Math.random() * 100;
                let levelSpeedMultiplier = 0.5 + (manualLevel - 1) * 0.2;

                if (this.isBoss) { 
                    this.radius = 65; this.baseSpeed = 0.9; this.health = 2500;
                    this.movingToCenter = true;
                    this.barrier = true; 
                    this.actionType = 4;
                    this.actionTimer = 0;
                    this.subTimer = 0;
                    this.actionData = {};
                    this.isCoolingDown = false;
                    this.coolDownTimer = 0;
                } else if (this.type === 'spiderling') { 
                    this.radius = 15; this.baseSpeed = 1.8; this.health = 100; 
                    this.spiderlingTimer = 1800; 
                } else if (this.type === 'blue') { 
                    this.radius = 18; this.baseSpeed = 2.5 * levelSpeedMultiplier; this.health = 12; 
                } else if (this.type === 'yellow') { 
                    this.radius = 16; this.baseSpeed = 2.2 * levelSpeedMultiplier; this.health = 15; 
                } else if (this.type === 'green') { 
                    this.radius = 17; this.baseSpeed = 1.1 * levelSpeedMultiplier; this.health = 45; 
                } else if (this.type === 'purple') { 
                    this.radius = 28; this.baseSpeed = 1.2 * levelSpeedMultiplier; this.health = 80; 
                }
                this.color = this.getColor();
                this.fleeing = false; 
            }
            getColor() {
                if (this.isBoss) return '#4a1515';
                if (this.type === 'spiderling') return '#3a1010';
                if (this.type === 'blue') return '#0277bd';
                if (this.type === 'yellow') return '#b26a00';
                if (this.type === 'green') return '#558b2f';
                if (this.type === 'purple') return '#4a148c';
                return '#fff';
            }
            startCoolDown() {
                this.isCoolingDown = true;
                this.coolDownTimer = 300;
                this.actionType = 0;
            }
            pickNewAction() {
                for (let w of webEffects) {
                    if (w.persistent && w.bossOwned) {
                        w.actionCountDown--;
                    }
                }

                this.actionType = Math.floor(Math.random() * 5) + 1;
                this.actionTimer = 0;
                this.subTimer = 0;
                this.actionData = {};

                if (this.actionType === 1) {
                    this.actionData.shotsFired = 0;
                    this.actionData.angleOffset = 0;
                } else if (this.actionType === 2) {
                    this.actionData.bounces = 0;
                    this.actionData.isPreparingDash = true;
                    this.actionData.dashPrepTimer = 60;
                } else if (this.actionType === 3) {
                    for (let i = 0; i < 3; i++) {
                        let sp = new Kabuto('spiderling');
                        sp.x = this.x + (Math.random() - 0.5) * 60;
                        sp.y = this.y + (Math.random() - 0.5) * 60;
                        kabutos.push(sp);
                    }
                    playSound('blue');
                } else if (this.actionType === 4) {
                    this.barrier = true;
                    playSound('barrierBreak');
                } else if (this.actionType === 5) {
                    webEffects.push({ x: player.x, y: player.y, radius: 110, persistent: true, bossOwned: true, actionCountDown: 3 });
                    playSound('squash');
                }
            }
            setupDash() {
                let wall = Math.floor(Math.random() * 4);
                if (wall === 0) { this.x = Math.random() * canvas.width; this.y = 20; }
                else if (wall === 1) { this.x = Math.random() * canvas.width; this.y = canvas.height - 20; }
                else if (wall === 2) { this.x = 20; this.y = Math.random() * canvas.height; }
                else { this.x = canvas.width - 20; this.y = Math.random() * canvas.height; }

                let tx = Math.random() * canvas.width, ty = Math.random() * canvas.height;
                let angle = Math.atan2(ty - this.y, tx - this.x);
                this.actionData.vx = Math.cos(angle) * 12;
                this.actionData.vy = Math.sin(angle) * 12;
                this.actionData.warning = true;
                this.actionData.warnTimer = 40;
            }
            update() {
                let targetX = player.x, targetY = player.y;

                if (this.isBoss) {
                    if (this.movingToCenter) {
                        let dx = canvas.width / 2 - this.x, dy = (canvas.height / 3) - this.y;
                        this.x += dx * 0.05; this.y += dy * 0.05;
                        if (Math.hypot(dx, dy) < 5) this.movingToCenter = false;
                        return;
                    }

                    if (this.isCoolingDown) {
                        this.coolDownTimer--;
                        if (this.coolDownTimer <= 0) {
                            this.isCoolingDown = false;
                            this.pickNewAction();
                        }
                        return;
                    }

                    this.actionTimer++;

                    if (this.actionTimer > 300) {
                        this.startCoolDown();
                        return;
                    }

                    if (this.actionType === 1) {
                        if (this.actionTimer % 60 === 1) {
                            let count = this.actionData.shotsFired;
                            if (count < 5) {
                                let baseAngleOffset = (this.actionData.angleOffset * Math.PI) / 180;
                                for (let i = 0; i < 16; i++) {
                                    let angle = (Math.PI * 2 / 16) * i + baseAngleOffset;
                                    bossBullets.push({ x: this.x, y: this.y, vx: Math.cos(angle) * 4.5, vy: Math.sin(angle) * 4.5, radius: 7 });
                                }
                                playSound('blue');
                                this.actionData.shotsFired++;
                                this.actionData.angleOffset += 5;
                            } else {
                                this.startCoolDown();
                            }
                        }
                    } else if (this.actionType === 2) {
                        if (this.actionData.isPreparingDash) {
                            this.actionData.dashPrepTimer--;
                            if (this.actionData.dashPrepTimer <= 0) {
                                this.actionData.isPreparingDash = false;
                                this.setupDash();
                            }
                        } else if (this.actionData.warning) {
                            this.actionData.warnTimer--;
                            if (this.actionData.warnTimer <= 0) {
                                this.actionData.warning = false;
                            }
                        } else {
                            this.x += this.actionData.vx;
                            this.y += this.actionData.vy;
                            let bounced = false;
                            if (this.x < 30 || this.x > canvas.width - 30) { this.actionData.vx *= -1; bounced = true; }
                            if (this.y < 30 || this.y > canvas.height - 30) { this.actionData.vy *= -1; bounced = true; }
                            if (bounced) {
                                this.actionData.bounces++;
                                playSound('barrierBreak');
                                if (this.actionData.bounces >= 3) {
                                    this.startCoolDown();
                                }
                            }
                        }
                    } else if (this.actionType === 3) {
                        this.startCoolDown();
                    } else if (this.actionType === 4) {
                        if (!this.barrier) {
                            this.startCoolDown();
                        }
                    } else if (this.actionType === 5) {
                        this.startCoolDown();
                    }
                    return;
                }

                if (this.type === 'spiderling') {
                    this.spiderlingTimer--;
                    if (this.spiderlingTimer <= 0) {
                        this.health = 0;
                        return;
                    }
                }

                if (this.fleeing) {
                    let angleFromBoss = Math.atan2(this.y - canvas.height/3, this.x - canvas.width/2);
                    this.x += Math.cos(angleFromBoss) * 5.0;
                    this.y += Math.sin(angleFromBoss) * 5.0;
                    return;
                }

                this.zigZagTimer++;
                let angleToPlayer = Math.atan2(targetY - this.y, targetX - this.x);
                let moveAngle = angleToPlayer;
                if (this.type === 'yellow') {
                    moveAngle += Math.sin(this.zigZagTimer * 0.3) * 1.5;
                }
                this.x += Math.cos(moveAngle) * this.baseSpeed;
                this.y += Math.sin(moveAngle) * this.baseSpeed;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                let angleToPlayer = Math.atan2(player.y - this.y, player.x - this.x);
                ctx.rotate(angleToPlayer + Math.PI / 2);

                if (this.isBoss) {
                    if (this.barrier) {
                        ctx.save();
                        ctx.rotate(gameTime * 0.03);
                        ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 3;
                        ctx.beginPath(); ctx.arc(0, 0, this.radius + 25 + Math.sin(gameTime*0.1)*4, 0, Math.PI * 2); ctx.stroke();
                        
                        ctx.strokeStyle = '#3a1010'; ctx.lineWidth = 2;
                        ctx.setLineDash([8, 6]);
                        ctx.beginPath(); ctx.arc(0, 0, this.radius + 18, 0, Math.PI * 2); ctx.stroke();
                        ctx.setLineDash([]);
                        
                        ctx.fillStyle = 'rgba(0, 229, 255, 0.15)';
                        ctx.beginPath(); ctx.arc(0, 0, this.radius + 25, 0, Math.PI * 2); ctx.fill();
                        ctx.restore();
                    }

                    ctx.strokeStyle = '#2b0f0f'; ctx.lineWidth = 4;
                    for (let i = 0; i < 8; i++) {
                        let legAngle = (Math.PI * 2 / 8) * i + 0.3;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(legAngle) * (this.radius * 0.4), Math.sin(legAngle) * (this.radius * 0.4));
                        ctx.quadraticCurveTo(
                            Math.cos(legAngle) * (this.radius + 30) + Math.sin(gameTime * 0.1 + i) * 10,
                            Math.sin(legAngle) * (this.radius + 30) + Math.cos(gameTime * 0.1 + i) * 10,
                            Math.cos(legAngle) * (this.radius + 55),
                            Math.sin(legAngle) * (this.radius + 55)
                        );
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#4a1515';
                    ctx.beginPath(); ctx.ellipse(0, this.radius * 0.5, this.radius * 0.7, this.radius * 0.9, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#852929'; ctx.lineWidth = 2; ctx.stroke();

                    ctx.fillStyle = '#2b0f0f';
                    ctx.beginPath(); ctx.arc(0, -this.radius * 0.3, this.radius * 0.55, 0, Math.PI * 2); ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#111';
                    for(let e = -2; e <= 2; e++) {
                        ctx.beginPath(); ctx.arc(e * 5, -this.radius * 0.6, 2.5, 0, Math.PI * 2); ctx.fill();
                    }

                } else if (this.type === 'spiderling') {
                    ctx.strokeStyle = '#1b0808'; ctx.lineWidth = 2.5;
                    for (let i = 0; i < 8; i++) {
                        let legAngle = (Math.PI * 2 / 8) * i;
                        ctx.beginPath();
                        ctx.moveTo(Math.cos(legAngle) * (this.radius * 0.3), Math.sin(legAngle) * (this.radius * 0.3));
                        ctx.lineTo(Math.cos(legAngle) * (this.radius + 12), Math.sin(legAngle) * (this.radius + 12));
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#3a1010';
                    ctx.beginPath(); ctx.ellipse(0, 3, this.radius * 0.6, this.radius * 0.7, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#5a2020'; ctx.lineWidth = 1; ctx.stroke();

                    ctx.fillStyle = '#1b0808';
                    ctx.beginPath(); ctx.arc(0, -this.radius * 0.3, this.radius * 0.45, 0, Math.PI * 2); ctx.fill();
                    ctx.stroke();

                } else if (this.type === 'blue') {
                    ctx.strokeStyle = '#01579b'; ctx.lineWidth = 1.5;
                    for (let i = 0; i < 3; i++) {
                        let legOffset = -this.radius * 0.3 + i * this.radius * 0.3;
                        ctx.beginPath();
                        ctx.moveTo(-this.radius * 0.5, legOffset);
                        ctx.lineTo(-this.radius * 1.1, legOffset - 5);
                        ctx.moveTo(this.radius * 0.5, legOffset);
                        ctx.lineTo(this.radius * 1.1, legOffset - 5);
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#0277bd';
                    ctx.beginPath(); ctx.ellipse(0, 0, this.radius * 0.65, this.radius, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 1.5; ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, -this.radius * 0.6); ctx.lineTo(0, this.radius * 0.8); ctx.stroke();
                    ctx.fillStyle = '#01579b';
                    ctx.beginPath(); ctx.ellipse(0, -this.radius * 0.7, this.radius * 0.45, this.radius * 0.35, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#b3e5fc';
                    ctx.beginPath(); ctx.arc(-4, -this.radius * 0.85, 2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(4, -this.radius * 0.85, 2, 0, Math.PI * 2); ctx.fill();

                } else if (this.type === 'yellow') {
                    ctx.fillStyle = '#b26a00';
                    ctx.beginPath(); ctx.ellipse(0, 2, this.radius * 0.7, this.radius * 0.75, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#ffcc80'; ctx.lineWidth = 1.5; ctx.stroke();
                    ctx.fillStyle = '#8d5524';
                    ctx.beginPath(); ctx.arc(0, -this.radius * 0.35, this.radius * 0.5, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-this.radius * 0.4, -this.radius * 0.5);
                    ctx.quadraticCurveTo(-this.radius * 1.3, -this.radius * 1.3, -this.radius * 0.3, -this.radius * 1.5);
                    ctx.moveTo(this.radius * 0.4, -this.radius * 0.5);
                    ctx.quadraticCurveTo(this.radius * 1.3, -this.radius * 1.3, this.radius * 0.3, -this.radius * 1.5);
                    ctx.stroke();

                } else if (this.type === 'green') {
                    ctx.fillStyle = '#558b2f';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius);
                    ctx.lineTo(this.radius * 0.9, -this.radius * 0.3);
                    ctx.lineTo(this.radius * 0.7, this.radius * 0.9);
                    ctx.lineTo(-this.radius * 0.7, this.radius * 0.9);
                    ctx.lineTo(-this.radius * 0.9, -this.radius * 0.3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = '#c5e1a5'; ctx.lineWidth = 1.5; ctx.stroke();
                    ctx.fillStyle = '#33691e';
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius * 0.2);
                    ctx.lineTo(this.radius * 0.4, this.radius * 0.5);
                    ctx.lineTo(-this.radius * 0.4, this.radius * 0.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#2e7d32';
                    ctx.beginPath(); ctx.arc(0, -this.radius * 0.85, this.radius * 0.25, 0, Math.PI * 2); ctx.fill();

                } else if (this.type === 'purple') {
                    ctx.fillStyle = '#4a148c';
                    ctx.beginPath(); ctx.ellipse(0, 4, this.radius * 0.85, this.radius * 0.85, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#e1bee7'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#311b92';
                    ctx.beginPath(); ctx.arc(0, -this.radius * 0.2, this.radius * 0.6, 0, Math.PI * 2); ctx.fill();
                    ctx.strokeStyle = '#311b92'; ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, -this.radius * 0.4);
                    ctx.lineTo(0, -this.radius * 1.65);
                    ctx.lineTo(-this.radius * 0.35, -this.radius * 1.9);
                    ctx.moveTo(0, -this.radius * 1.65);
                    ctx.lineTo(this.radius * 0.35, -this.radius * 1.9);
                    ctx.stroke();
                }
                ctx.restore();

                if (this.isBoss && this.actionType === 2 && this.actionData.isPreparingDash) {
                    ctx.save();
                    ctx.font = 'bold 40px Courier New';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = Math.floor(gameTime / 10) % 2 === 0 ? '#ff3333' : '#ffff00';
                    ctx.fillText('❗ 蜘蛛突進予告 ❗', this.x, this.y - this.radius - 40);
                    ctx.restore();
                }
            }
        }

        function initGame() {
            score = 0; lives = 3; armor = 0; manualLevel = 1; gameTime = 0; spawnTimer = 0;
            gameOver = false; bossSpawnedInLevel4 = false; electricActiveTimer = 0; laserActiveTimer = 0; screenShake = 0;
            player.weaponType = selectedInitialWeapon;
            kabutos = []; items = []; pesticides = []; lasers = []; homingLasers = [];
            redHeavyLasers = []; bossBullets = []; webEffects = []; particles = [];
        }

        function takeDamage() {
            if (armor > 0) { armor--; playSound('barrierBreak'); screenShake = 8; } 
            else { lives--; playSound('purple'); screenShake = 15; }
            if (lives <= 0) {
                gameOver = true;
                highScores.push({ name: playerName, score: score });
                highScores.sort((a, b) => b.score - a.score);
                highScores = highScores.slice(0, 3);
                // ハイスコアをlocalStorageに保存してブラウザを閉じても残るようにする
                localStorage.setItem('kabutoPanicHighScores', JSON.stringify(highScores));
            }
        }

        function update() {
            if (!gameStarted || gameOver) {
                if (screenShake > 0) screenShake = 0;
                return;
            }

            gameTime++;
            if (shootCooldown > 0) shootCooldown--;
            if (heavyCooldown > 0) heavyCooldown--;
            if (screenShake > 0) screenShake--;
            if (laserActiveTimer > 0) laserActiveTimer--;
            if (electricActiveTimer > 0) electricActiveTimer--;

            manualLevel = Math.min(5, Math.floor(score / 300) + 1);
            if (manualLevel >= 4 && !bossSpawnedInLevel4) {
                bossSpawnedInLevel4 = true;
                kabutos.push(new Kabuto('red', true));
                for(let k of kabutos) {
                    if (!k.isBoss) k.fleeing = true;
                }
            }

            for (let i = kabutos.length - 1; i >= 0; i--) {
                let k = kabutos[i];
                if (k.fleeing && (k.x < -100 || k.x > canvas.width + 100 || k.y < -100 || k.y > canvas.height + 100)) {
                    kabutos.splice(i, 1);
                }
            }

            let moveSpeed = 12;
            let dx = mouse.x - player.x, dy = mouse.y - player.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 0.1) {
                player.x += (dx / dist) * Math.min(dist, moveSpeed);
                player.y += (dy / dist) * Math.min(dist, moveSpeed);
                player.lastAngle = Math.atan2(dy, dx);
            } else {
                player.x = mouse.x;
                player.y = mouse.y;
            }

            let playerRadius = 15;
            player.x = Math.max(playerRadius, Math.min(canvas.width - playerRadius, player.x));
            player.y = Math.max(playerRadius, Math.min(canvas.height - playerRadius, player.y));

            if (mouse.isDown) attack();

            if (electricActiveTimer > 0) {
                if (gameTime % 10 === 0) playSound('electric');
                for (let k of kabutos) {
                    if (k.x >= 0 && k.x <= canvas.width && k.y >= 0 && k.y <= canvas.height) {
                        if (Math.hypot(player.x - k.x, player.y - k.y) < 150) k.health -= 2.5;
                    }
                }
            }

            let hasBoss = kabutos.some(k => k.isBoss);
            if (!hasBoss) {
                spawnTimer++;
                if (spawnTimer > Math.max(25, 80 - manualLevel * 10)) {
                    spawnTimer = 0;
                    let pool = ['blue', 'blue', 'yellow'];
                    if (manualLevel >= 2) pool.push('green', 'yellow');
                    if (manualLevel >= 3) pool.push('purple', 'green');
                    if (manualLevel >= 4) pool.push('purple', 'purple');
                    let type = pool[Math.floor(Math.random() * pool.length)];
                    kabutos.push(new Kabuto(type));
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                if (!it.lifeTime) it.lifeTime = 300;
                it.lifeTime--;
                if (it.lifeTime <= 0) {
                    items.splice(i, 1);
                    continue;
                }

                if (Math.hypot(player.x - it.x, player.y - it.y) < 30) {
                    if (it.type === 'blue') laserActiveTimer = 300;
                    else if (it.type === 'green') lives++;
                    else if (it.type === 'purple') armor++;
                    else if (it.type === 'yellow') electricActiveTimer = 300;
                    else if (it.type === 'red') player.weaponType = 'redHeavyLaser';
                    playSound('green');
                    items.splice(i, 1);
                    continue;
                }
            }

            for (let i = webEffects.length - 1; i >= 0; i--) {
                let w = webEffects[i];
                if (w.persistent) {
                    if (w.actionCountDown <= 0) {
                        webEffects.splice(i, 1);
                    }
                } else {
                    w.lifeTime--;
                    if (w.lifeTime <= 0) webEffects.splice(i, 1);
                }
            }

            for (let i = bossBullets.length - 1; i >= 0; i--) {
                let b = bossBullets[i]; b.x += b.vx; b.y += b.vy;
                if (Math.hypot(player.x - b.x, player.y - b.y) < b.radius + 10) {
                    takeDamage(); bossBullets.splice(i, 1); continue;
                }
                if (b.x < -50 || b.x > canvas.width+50 || b.y < -50 || b.y > canvas.height+50) bossBullets.splice(i, 1);
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i]; l.x += l.vx; l.y += l.vy;
                let hit = false;
                for (let k of kabutos) {
                    if (k.x < 0 || k.x > canvas.width || k.y < 0 || k.y > canvas.height) continue;
                    if (Math.hypot(k.x - l.x, k.y - l.y) < k.radius + 10) {
                        if (!(k.isBoss && k.barrier)) {
                            k.health -= 15;
                        }
                        hit = true;
                        for(let p=0; p<3; p++) particles.push(new Particle(l.x, l.y, '#76ff03', Math.random()*4, 15));
                        break;
                    }
                }
                if (hit || l.x < 0 || l.x > canvas.width || l.y < 0 || l.y > canvas.height) lasers.splice(i, 1);
            }

            for (let i = homingLasers.length - 1; i >= 0; i--) {
                let hl = homingLasers[i];
                if (kabutos.length > 0) {
                    let nearest = kabutos[0], minDist = Math.hypot(nearest.x - hl.x, nearest.y - hl.y);
                    for (let k of kabutos) {
                        let d = Math.hypot(k.x - hl.x, k.y - hl.y);
                        if (d < minDist) { minDist = d; nearest = k; }
                    }
                    let targetAngle = Math.atan2(nearest.y - hl.y, nearest.x - hl.x);
                    hl.vx = Math.cos(targetAngle) * hl.speed;
                    hl.vy = Math.sin(targetAngle) * hl.speed;
                }
                hl.x += hl.vx; hl.y += hl.vy;
                let hit = false;
                for (let k of kabutos) {
                    if (Math.hypot(k.x - hl.x, k.y - hl.y) < k.radius + 10) {
                        if (!(k.isBoss && k.barrier)) {
                            k.health -= 25;
                        }
                        hit = true;
                        for(let p=0; p<3; p++) particles.push(new Particle(hl.x, hl.y, '#4488ff', Math.random()*4, 15));
                        break;
                    }
                }
                if (hit || hl.x < 0 || hl.x > canvas.width || hl.y < 0 || hl.y > canvas.height) homingLasers.splice(i, 1);
            }

            for (let i = redHeavyLasers.length - 1; i >= 0; i--) {
                let rhl = redHeavyLasers[i];
                if (kabutos.length > 0) {
                    let nearest = kabutos[0], minDist = Math.hypot(nearest.x - rhl.x, nearest.y - rhl.y);
                    for (let k of kabutos) {
                        let d = Math.hypot(k.x - rhl.x, k.y - rhl.y);
                        if (d < minDist) { minDist = d; nearest = k; }
                    }
                    let targetAngle = Math.atan2(nearest.y - rhl.y, nearest.x - rhl.x);
                    rhl.vx = Math.cos(targetAngle) * rhl.speed;
                    rhl.vy = Math.sin(targetAngle) * rhl.speed;
                }
                rhl.x += rhl.vx; rhl.y += rhl.vy;

                let hit = false;
                for (let k of kabutos) {
                    if (Math.hypot(k.x - rhl.x, k.y - rhl.y) < k.radius + rhl.radius) {
                        if (k.isBoss && k.barrier) {
                            k.barrier = false;
                            playSound('barrierBreak');
                        }
                        k.health -= 300;
                        hit = true;
                        screenShake = 15;
                        for(let p=0; p<15; p++) particles.push(new Particle(rhl.x, rhl.y, '#3a1010', Math.random()*6, 25));
                        break;
                    }
                }
                if (hit || rhl.x < 0 || rhl.x > canvas.width || rhl.y < 0 || rhl.y > canvas.height) redHeavyLasers.splice(i, 1);
            }

            for (let i = pesticides.length - 1; i >= 0; i--) {
                let p = pesticides[i]; p.lifeTime--;
                if (p.lifeTime <= 0) { pesticides.splice(i, 1); continue; }
                for (let k of kabutos) {
                    if (Math.hypot(k.x - p.x, k.y - p.y) < p.radius + k.radius) {
                        if (!(k.isBoss && k.barrier)) {
                            k.health = 0;
                        }
                    }
                }
            }

            for (let i = kabutos.length - 1; i >= 0; i--) {
                let k = kabutos[i]; k.update();
                if (k.health <= 0) {
                    if (!k.isBoss) {
                        score += 10;
                        let dropType = null;
                        if (k.type === 'blue') dropType = 'blue';
                        else if (k.type === 'yellow') dropType = 'yellow';
                        else if (k.type === 'green') dropType = 'green';
                        else if (k.type === 'purple') dropType = 'purple';
                        else if (k.type === 'spiderling') dropType = 'red';

                        if (dropType) {
                            if (dropType === 'red' || Math.random() < 0.4) {
                                items.push({ x: k.x, y: k.y, type: dropType });
                            }
                        }
                    } else {
                        score += 500;
                    }
                    playSound('squash');
                    for(let p=0; p<8; p++) particles.push(new Particle(k.x, k.y, k.color, Math.random()*5, 20));
                    kabutos.splice(i, 1);
                    continue;
                }
                if (!k.fleeing && Math.hypot(player.x - k.x, player.y - k.y) < k.radius + 10) {
                    takeDamage();
                    if (!k.isBoss) kabutos.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) {
                let sx = (Math.random() - 0.5) * screenShake;
                let sy = (Math.random() - 0.5) * screenShake;
                ctx.translate(sx, sy);
            }

            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let w of webEffects) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(w.x, w.y, w.radius * 0.6, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(w.x, w.y, w.radius * 0.2, 0, Math.PI * 2); ctx.stroke();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
                    ctx.moveTo(w.x, w.y);
                    ctx.lineTo(w.x + Math.cos(a) * w.radius, w.y + Math.sin(a) * w.radius);
                }
                ctx.stroke();
                ctx.restore();
            }

            for (let it of items) {
                ctx.save();
                ctx.translate(it.x, it.y);
                let col = '#fff';
                if (it.type === 'blue') col = '#00b0ff';
                else if (it.type === 'green') col = '#7cb342';
                else if (it.type === 'purple') col = '#7b1fa2';
                else if (it.type === 'yellow') col = '#ffb300';
                else if (it.type === 'red') col = '#ff3333';

                ctx.fillStyle = col;
                ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.restore();
            }

            ctx.save();
            translatePlayer: {
                ctx.translate(player.x, player.y);
                ctx.rotate(player.lastAngle + Math.PI / 2);
                ctx.fillStyle = '#76ff03';
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(12, 12);
                ctx.lineTo(-12, 12);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
            ctx.restore();

            if (electricActiveTimer > 0) {
                ctx.save();
                ctx.strokeStyle = '#ffeb3b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let angle = 0; angle < Math.PI * 2; angle += Math.PI / 6) {
                    let r = 50 + Math.random() * 30;
                    let ex = player.x + Math.cos(angle + gameTime * 0.2) * r;
                    let ey = player.y + Math.sin(angle + gameTime * 0.2) * r;
                    if (angle === 0) ctx.moveTo(ex, ey);
                    else ctx.lineTo(ex, ey);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.fillStyle = 'rgba(255, 235, 59, 0.15)';
                ctx.fill();
                ctx.restore();
            }

            for (let p of pesticides) {
                ctx.save();
                ctx.strokeStyle = '#aa44ff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.stroke();
                ctx.fillStyle = 'rgba(170, 68, 255, 0.1)'; ctx.fill();
                ctx.restore();
            }

            for (let l of lasers) {
                ctx.fillStyle = '#76ff03';
                ctx.beginPath(); ctx.arc(l.x, l.y, 5, 0, Math.PI * 2); ctx.fill();
            }

            for (let hl of homingLasers) {
                ctx.fillStyle = '#4488ff';
                ctx.beginPath(); ctx.arc(hl.x, hl.y, 6, 0, Math.PI * 2); ctx.fill();
            }

            for (let rhl of redHeavyLasers) {
                ctx.fillStyle = '#3a1010';
                ctx.beginPath(); ctx.arc(rhl.x, rhl.y, rhl.radius, 0, Math.PI * 2); ctx.fill();
            }

            for (let b of bossBullets) {
                ctx.fillStyle = '#5a2020';
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
            }

            for (let k of kabutos) {
                k.draw();
                if (k.isBoss) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(canvas.width / 2 - 200, 30, 400, 20);
                    ctx.fillStyle = '#3a1010';
                    ctx.fillRect(canvas.width / 2 - 200, 30, (k.health / 2500) * 400, 20);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.strokeRect(canvas.width / 2 - 200, 30, 400, 20);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px Courier New'; ctx.textAlign = 'center';
                    ctx.fillText(`GIANT SPIDER / BOSS (HP: ${Math.max(0, Math.floor(k.health))})`, canvas.width / 2, 45);
                    ctx.restore();
                }
            }

            for (let p of particles) {
                p.draw();
            }

            ctx.fillStyle = '#fff';
            ctx.font = '16px Courier New';
            ctx.fillText(`PLAYER: ${playerName}`, 20, 30);
            ctx.fillText(`SCORE: ${score}`, 20, 55);
            ctx.fillText(`LIVES: ${'❤️'.repeat(Math.max(0, lives))}`, 20, 80);
            ctx.fillText(`ARMOR: ${'🛡️'.repeat(Math.max(0, armor))}`, 20, 105);
            ctx.fillText(`LEVEL: ${manualLevel} / 5`, 20, 130);

            if (laserActiveTimer > 0) {
                ctx.fillStyle = '#00b0ff';
                ctx.fillText(`追尾弾効果中: ${Math.ceil(laserActiveTimer / 60)}s`, 20, 155);
            }
            if (electricActiveTimer > 0) {
                ctx.fillStyle = '#ffb300';
                ctx.fillText(`電気攻撃中: ${Math.ceil(electricActiveTimer / 60)}s`, 20, 180);
            }

            if (!gameStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#76ff03';
                ctx.font = 'bold 36px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('KABUTO PANIC - REAL BUG EDITION', canvas.width / 2, canvas.height / 2 - 150);
                
                ctx.font = 'bold 18px Courier New';
                ctx.fillStyle = '#ffcc00';
                ctx.fillText('--- HIGH SCORES ---', canvas.width / 2, canvas.height / 2 - 105);
                ctx.font = '15px Courier New';
                ctx.fillStyle = '#fff';
                for (let i = 0; i < highScores.length; i++) {
                    let entry = highScores[i];
                    ctx.fillText(`${i + 1}. ${entry.name} - ${entry.score} pts`, canvas.width / 2, canvas.height / 2 - 75 + i * 22);
                }

                ctx.font = '20px Courier New';
                ctx.fillStyle = '#fff';
                ctx.fillText('初期武器を選択してください ([1] または [2])', canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText('[ 1 ] 殺虫スモーク (広範囲・高威力)', canvas.width / 2, canvas.height / 2 + 50);
                ctx.fillText('[ 2 ] 通常レーザー (遠隔自動狙い)', canvas.width / 2, canvas.height / 2 + 90);
            } else if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 48px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Courier New';
                ctx.fillText(`${playerName} の最終スコア: ${score}`, canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText('[ Enter キー ] を押してスタート画面へ戻る', canvas.width / 2, canvas.height / 2 + 60);
            }

            ctx.restore();
        }

        function gameLoop() {
            // 入力欄の値が変更されたら随時プレイヤー名に反映
            if (!gameStarted && nameInput) {
                playerName = nameInput.value.trim() || 'PLAYER';
            }

            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
